name: Deploy to Fly.io

# Tests run on every push to main and every pull request into main.
# Deploying only happens on a push to main, and only after the tests pass.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Backend: same Python version as the Dockerfile.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Watch contract (/toggle, /status) + page routing tests.
      - run: python -m pytest

      # Frontend: same Node version as the Dockerfile's build stage.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      # `build` runs `tsc -b` (type-check) before `vite build`.
      - run: npm run build
        working-directory: frontend

  deploy:
    name: Deploy app
    # Waits for the test job; if it fails, this job is skipped.
    needs: test
    # Pull requests only run the tests - never deploy them.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: FLY_API_TOKEN  # matches the Environment you created in GitHub Settings
    steps:
      # Pulls your repo's code into this workflow's temporary machine
      - uses: actions/checkout@v4

      # Installs the flyctl CLI (same tool you've been running manually)
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Runs the exact same command you've been running by hand:
      # `fly deploy` - but now triggered automatically on push.
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
