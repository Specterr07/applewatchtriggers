name: Deploy to Fly.io

# Runs automatically every time code is pushed to the main branch.
on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    steps:
      # Pulls your repo's code into this workflow's temporary machine
      - uses: actions/checkout@v4

      # Installs the flyctl CLI (same tool you've been running manually)
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Runs the exact same command you've been running by hand:
      # `fly deploy` - but now triggered automatically on push.
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
