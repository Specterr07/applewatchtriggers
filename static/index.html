<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sheev</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --border: #2a2e38;
    --text: #e8e9ec;
    --muted: #8b8f9a;
    --accent: #5b8cff;
    --accent-2: #ff6b6b;
    --green: #3ecf8e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 60px;
  }
  header {
    padding: 20px 16px 8px;
    text-align: center;
  }
  header h1 { font-size: 20px; margin: 0; font-weight: 600; }
  header .tagline { color: var(--muted); font-size: 13px; margin: 4px 0 0; }

  /* --- Login overlay --- */
  #login-overlay {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  #login-overlay .box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px 22px;
    width: 100%; max-width: 320px;
    text-align: center;
  }
  #login-overlay input {
    width: 100%;
    padding: 12px;
    margin: 16px 0;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #10131a;
    color: var(--text);
    font-size: 15px;
  }
  #login-overlay button, .primary-btn {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 15px;
    font-weight: 600;
  }
  #login-error { color: var(--accent-2); font-size: 13px; min-height: 16px; }

  /* --- Tabs --- */
  .tabs {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    max-width: 700px;
    margin: 0 auto;
  }
  .tab-btn {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
  }
  .tab-btn.active { color: white; border-color: var(--accent); background: #202436; }

  .view { display: none; max-width: 700px; margin: 0 auto; padding: 0 16px; }
  .view.active { display: block; }

  /* --- Time Log --- */
  #toggle-btn {
    width: 100%;
    padding: 22px;
    border-radius: 16px;
    border: none;
    font-size: 18px;
    font-weight: 700;
    margin: 8px 0 20px;
    background: var(--green);
    color: #063;
  }
  #toggle-btn.ending { background: var(--accent-2); color: #400; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .session-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
  .session-row .muted { color: var(--muted); font-size: 12px; }
  .session-row .dur { font-weight: 700; color: var(--green); }

  /* --- Bento cards (Time Log) --- */
  .bento-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
  }
  .bento-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .bento-card:hover, .bento-card:focus { border-color: var(--accent); outline: none; }
  .bento-title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bento-meta { font-size: 11px; color: var(--muted); margin-bottom: 12px; }
  .bento-duration { font-size: 28px; font-weight: 800; color: var(--green); line-height: 1; }
  .bento-unit { font-size: 13px; font-weight: 600; color: var(--muted); margin-left: 4px; }

  /* --- Task detail --- */
  .back-btn {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 14px;
    font-weight: 600;
    padding: 8px 0;
    margin-bottom: 8px;
  }
  .detail-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
  }
  .detail-title-input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    font-size: 18px;
    font-weight: 700;
    padding: 4px 0 8px;
    margin-bottom: 4px;
  }
  .detail-title-input:focus { outline: none; border-bottom-color: var(--accent); }
  .detail-date { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .detail-duration { font-size: 36px; font-weight: 800; color: var(--green); margin-bottom: 18px; }
  .detail-label {
    display: block;
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin: 12px 0 4px;
  }
  .detail-card input[type="datetime-local"] {
    width: 100%;
    background: #10131a;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px;
    font-size: 13px;
  }
  .detail-actions { display: flex; gap: 8px; margin-top: 20px; }
  .detail-actions button { flex: 1; width: auto; }
  .danger-btn {
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--accent-2);
    background: transparent;
    color: var(--accent-2);
    font-size: 15px;
    font-weight: 600;
  }

  /* --- Notes --- */
  #note-record-btn {
    flex: 1;
    width: auto;
    padding: 22px;
    border-radius: 16px;
    border: none;
    font-size: 18px;
    font-weight: 700;
    background: var(--accent);
    color: white;
  }
  #note-record-btn.recording {
    background: var(--accent-2);
    animation: note-pulse-bg 1.4s ease-in-out infinite;
  }
  #note-record-btn:disabled { opacity: 0.5; }
  @keyframes note-pulse-bg {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }

  .note-status {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 16px;
  }
  .note-status.visible { display: flex; }
  .note-pulse-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent);
    animation: note-pulse-dot 1s ease-in-out infinite;
  }
  @keyframes note-pulse-dot {
    0%, 100% { transform: scale(0.7); opacity: 0.5; }
    50% { transform: scale(1); opacity: 1; }
  }

  .note-error {
    display: none;
    background: rgba(255, 107, 107, 0.1);
    border: 1px solid var(--accent-2);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 16px;
    color: var(--accent-2);
    font-size: 14px;
    text-align: center;
  }
  .note-error.visible { display: block; }
  .note-error button {
    margin-top: 10px;
    width: auto;
    padding: 8px 20px;
    border-radius: 8px;
    border: none;
    background: var(--accent-2);
    color: white;
    font-size: 13px;
    font-weight: 600;
  }

  .note-record-row { display: flex; gap: 8px; margin: 8px 0 16px; }
  .note-cancel-btn {
    display: none;
    flex: 0 0 64px;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
  }
  .note-cancel-btn.visible { display: block; }

  /* --- Confirm dialog (reusable) --- */
  #confirm-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.6);
    align-items: center; justify-content: center;
    z-index: 200;
    padding: 20px;
  }
  #confirm-overlay.visible { display: flex; }
  #confirm-overlay .box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    width: 100%; max-width: 320px;
    text-align: center;
  }
  #confirm-message { font-size: 14px; line-height: 1.4; margin: 0 0 18px; }
  .confirm-actions { display: flex; gap: 8px; }
  .confirm-actions button { flex: 1; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 600; border: none; }
  #confirm-cancel-btn { background: #10131a; border: 1px solid var(--border); color: var(--text); }
  #confirm-ok-btn { background: var(--accent-2); color: white; }

  .note-card { display: flex; flex-direction: column; gap: 8px; }
  .note-transcript { font-size: 14px; line-height: 1.4; }
  .note-row { display: flex; align-items: center; gap: 8px; }
  .note-audio { flex: 1; height: 32px; }
  .note-del {
    background: none; border: none;
    color: var(--accent-2); font-weight: 700; font-size: 16px;
    padding: 4px 8px; cursor: pointer;
  }
  .note-meta { color: var(--muted); font-size: 11px; }

</style>
</head>
<body>

<div id="login-overlay">
  <div class="box">
    <h2>🔒 Sheev</h2>
    <p style="color:var(--muted); font-size:13px;">Enter your API key to continue</p>
    <input type="password" id="key-input" placeholder="API key" autocapitalize="off" autocorrect="off">
    <div id="login-error"></div>
    <button onclick="submitKey()">Unlock</button>
  </div>
</div>

<header>
  <h1>⏱ Sheev</h1>
  <p class="tagline">Let's get it done!</p>
</header>

<div class="tabs">
  <button class="tab-btn active" id="tab-log-btn" onclick="showTab('log')">Time Log</button>
  <button class="tab-btn" id="tab-notes-btn" onclick="showTab('notes')">Notes</button>
  <a class="tab-btn" href="/canvas" style="text-decoration:none; display:flex; align-items:center; justify-content:center;">Canvas</a>
</div>

<div class="view active" id="view-log">
  <button id="toggle-btn" onclick="doToggle()">...</button>
  <div id="sessions" class="bento-grid"></div>
</div>

<div class="view" id="view-detail">
  <button class="back-btn" onclick="closeTaskDetail()">← Back</button>
  <div class="detail-card">
    <input type="text" id="detail-title" class="detail-title-input" placeholder="Task name">
    <div class="detail-date" id="detail-date"></div>
    <div class="detail-duration" id="detail-duration">—</div>

    <label class="detail-label" for="detail-start">Start</label>
    <input type="datetime-local" id="detail-start" step="1">

    <label class="detail-label" for="detail-end">End</label>
    <input type="datetime-local" id="detail-end" step="1">

    <div class="detail-actions">
      <button class="primary-btn" onclick="saveTaskDetail()">Save</button>
      <button class="danger-btn" onclick="deleteTaskDetail()">Delete</button>
    </div>
  </div>
</div>

<div class="view" id="view-notes">
  <div class="note-record-row">
    <button id="note-record-btn" onclick="toggleRecording()">🎤 Record a note</button>
    <button class="note-cancel-btn" id="note-cancel-btn" onclick="cancelRecording()">✕ Cancel</button>
  </div>

  <div class="note-status" id="note-status">
    <span class="note-pulse-dot"></span> Transcribing…
  </div>

  <div class="note-error" id="note-error">
    <div id="note-error-message">Couldn't save that note.</div>
    <button onclick="retryUpload()">Retry</button>
  </div>

  <div id="notes-list"></div>
</div>

<div id="confirm-overlay">
  <div class="box">
    <p id="confirm-message"></p>
    <div class="confirm-actions">
      <button id="confirm-cancel-btn" onclick="resolveConfirm(false)">Cancel</button>
      <button id="confirm-ok-btn" onclick="resolveConfirm(true)">Delete</button>
    </div>
  </div>
</div>

<script>
const API_KEY_STORAGE = "task_logger_api_key";
let apiKey = localStorage.getItem(API_KEY_STORAGE);

function headers() {
  return { "Content-Type": "application/json", "X-API-Key": apiKey };
}

// ---------- Session expiry ----------
// A "session" here is just "this browser has a copy of the shared key."
// Two ways it ends: (1) reactively - the server rejects the key (401),
// e.g. because you rotated it - handled by authedFetch() below on every
// request made after login; (2) proactively - the key just gets too old,
// checked here client-side without waiting for a request to fail.
//
// Sliding expiry: SESSION_LAST_ACTIVE_STORAGE is refreshed on every
// successful (auth-wise) request, not just at login - so a tab you use
// daily never re-prompts, but one left untouched for the full window does.
const SESSION_LAST_ACTIVE_STORAGE = "task_logger_session_last_active";
const SESSION_EXPIRY_MS = 24 * 60 * 60 * 1000; // 24 hours

function touchSession() {
  localStorage.setItem(SESSION_LAST_ACTIVE_STORAGE, String(Date.now()));
}

function isSessionExpired() {
  const lastActive = parseInt(localStorage.getItem(SESSION_LAST_ACTIVE_STORAGE) || "0", 10);
  return !lastActive || (Date.now() - lastActive > SESSION_EXPIRY_MS);
}

// Clears the stored key and drops back to the login screen. Used both
// when the key goes stale on its own (time-based) and when the server
// actively rejects it (rotated on the server, or otherwise revoked).
function handleSessionExpired(message) {
  localStorage.removeItem(API_KEY_STORAGE);
  localStorage.removeItem(SESSION_LAST_ACTIVE_STORAGE);
  apiKey = null;
  document.getElementById("login-error").textContent = message;
  document.getElementById("login-overlay").style.display = "flex";
}

// Every authenticated fetch after login should go through this instead
// of plain fetch() - one place to catch "the key stopped working
// mid-session" instead of every call site checking for 401 itself.
// (The one exception is the login check itself in verifyKeyThenInit(),
// which already has its own more specific "incorrect key" message for
// a fresh login attempt.)
async function authedFetch(url, options) {
  const res = await fetch(url, options);
  if (res.status === 401) {
    handleSessionExpired("Your session is no longer valid. Please log in again.");
  } else {
    touchSession();
  }
  return res;
}

function submitKey() {
  const val = document.getElementById("key-input").value.trim();
  if (!val) return;
  apiKey = val;
  localStorage.setItem(API_KEY_STORAGE, val);
  verifyKeyThenInit();
}

async function verifyKeyThenInit() {
  try {
    const res = await fetch("/status", { headers: headers() });
    if (res.status === 401) {
      document.getElementById("login-error").textContent = "Incorrect key. Try again.";
      localStorage.removeItem(API_KEY_STORAGE);
      apiKey = null;
      return;
    }
    touchSession();
    document.getElementById("login-overlay").style.display = "none";
    init();
  } catch (e) {
    document.getElementById("login-error").textContent = "Couldn't reach server. Check your connection.";
  }
}

// Shows one of the views (log / detail / notes) and hides the others.
// Split out from showTab() because opening a task's detail view (from a
// bento card click) needs to swap views WITHOUT touching which tab
// button looks active - the user is still conceptually "in" Time Log.
function showView(name) {
  document.getElementById("view-log").classList.toggle("active", name === "log");
  document.getElementById("view-detail").classList.toggle("active", name === "detail");
  document.getElementById("view-notes").classList.toggle("active", name === "notes");
}

// Handles the actual tab buttons (Time Log / Notes) - same view-swap,
// plus updating which button is highlighted.
function showTab(name) {
  showView(name);
  document.getElementById("tab-log-btn").classList.toggle("active", name === "log");
  document.getElementById("tab-notes-btn").classList.toggle("active", name === "notes");
  if (name === "notes") loadNotes();
}

// Escapes a task/session name before it's dropped into innerHTML, so a
// name containing "<", "&", etc. (typed by you, from the webpage's own
// naming field) renders as text instead of broken/injected markup.
function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : String(str);
  return div.innerHTML;
}

// ---------- Time Log ----------
async function refreshStatus() {
  const res = await authedFetch("/status", { headers: headers() });
  const data = await res.json();
  const btn = document.getElementById("toggle-btn");
  if (data.next_action === "End") {
    btn.textContent = "⏹ End Task";
    btn.classList.add("ending");
  } else {
    btn.textContent = "▶ Start Task";
    btn.classList.remove("ending");
  }
}

async function doToggle() {
  const btn = document.getElementById("toggle-btn");
  btn.disabled = true;
  try {
    await authedFetch("/toggle", { headers: headers() });
    await refreshStatus();
    await loadSessions();
  } catch (e) {
    alert("Request failed - check your connection.");
  }
  btn.disabled = false;
}

async function loadSessions() {
  const res = await authedFetch("/api/logs", { headers: headers() });
  const data = await res.json();
  const container = document.getElementById("sessions");
  container.innerHTML = "";
  if (!data.sessions || data.sessions.length === 0) {
    container.innerHTML = '<p style="color:var(--muted); text-align:center;">No sessions logged yet.</p>';
    return;
  }
  // Bento grid: one card per task. name/date/start/end/duration_minutes
  // all come pre-formatted from the backend (including the generic
  // "Task – Fri, 9:00 AM" title for anything logged without a name) -
  // no client-side formatting logic needed here.
  data.sessions.slice(0, 30).forEach(s => {
    const card = document.createElement("button");
    card.className = "bento-card";
    card.type = "button";
    const timeRange = s.end
      ? `${s.start.slice(11, 16)} – ${s.end.slice(11, 16)}`
      : `${s.start.slice(11, 16)} · in progress`;
    const durText = s.duration_minutes != null ? s.duration_minutes : "–";
    card.innerHTML = `
      <div class="bento-title">${escapeHtml(s.name)}</div>
      <div class="bento-meta">${s.date} · ${timeRange}</div>
      <div class="bento-duration">${durText}${s.duration_minutes != null ? '<span class="bento-unit">min</span>' : ""}</div>`;
    card.onclick = () => openTaskDetail(s.id);
    container.appendChild(card);
  });
}

// ---------- Task detail ----------
let currentTask = null; // the task currently shown in the detail view

async function openTaskDetail(id) {
  const res = await authedFetch(`/api/logs/${id}`, { headers: headers() });
  const data = await res.json();
  if (!data.ok) {
    alert(data.message || "Could not load that task.");
    return;
  }
  currentTask = data.task;
  renderTaskDetail(currentTask);
  showView("detail");
}

function renderTaskDetail(task) {
  document.getElementById("detail-title").value = task.name;
  document.getElementById("detail-date").textContent = task.date;
  document.getElementById("detail-duration").textContent =
    task.duration_minutes != null ? `${task.duration_minutes} min` : "In progress";
  document.getElementById("detail-start").value = toDatetimeLocal(task.start);
  document.getElementById("detail-end").value = task.end ? toDatetimeLocal(task.end) : "";
}

// The backend stores "YYYY-MM-DD HH:MM:SS"; <input type="datetime-local">
// wants "YYYY-MM-DDTHH:MM:SS" (a "T" instead of the space - the "step=1"
// on those inputs is what makes them collect/show seconds at all).
function toDatetimeLocal(backendTimestamp) {
  return backendTimestamp.replace(" ", "T");
}

// Reverse of toDatetimeLocal. Defensive about the seconds: if a browser's
// datetime-local picker ignores step="1" and only gives minutes, this
// pads ":00" back on rather than sending the backend a timestamp it will
// reject as badly formatted.
function toBackendTimestamp(datetimeLocalValue) {
  const withSpace = datetimeLocalValue.replace("T", " ");
  return withSpace.length === 16 ? `${withSpace}:00` : withSpace;
}

async function saveTaskDetail() {
  const newName = document.getElementById("detail-title").value.trim();
  const newStartLocal = document.getElementById("detail-start").value;
  const newEndLocal = document.getElementById("detail-end").value;

  // Only send fields that actually changed, per the API contract - not
  // "start"/"end" just because the picker round-tripped the same value.
  const patch = {};
  if (newName !== currentTask.name) patch.name = newName;

  if (newStartLocal) {
    const newStart = toBackendTimestamp(newStartLocal);
    if (newStart !== currentTask.start) patch.start = newStart;
  }
  // Unlike start, end is allowed to be cleared - that reopens the task
  // (duration goes back to "in progress" on the backend).
  const newEnd = newEndLocal ? toBackendTimestamp(newEndLocal) : null;
  if (newEnd !== currentTask.end) patch.end = newEnd;

  if (Object.keys(patch).length === 0) {
    showTab("log"); // nothing changed - just go back
    return;
  }

  try {
    const res = await authedFetch(`/api/logs/${currentTask.id}`, {
      method: "PATCH",
      headers: headers(),
      body: JSON.stringify(patch)
    });
    const data = await res.json();
    if (!data.ok) {
      alert(data.message || "Could not save changes.");
      return;
    }
  } catch (e) {
    alert("Request failed - check your connection.");
    return;
  }

  showTab("log");
  loadSessions();
}

async function deleteTaskDetail() {
  if (!confirm("Delete this task? This can't be undone.")) return;
  try {
    const res = await authedFetch(`/api/logs/${currentTask.id}`, { method: "DELETE", headers: headers() });
    const data = await res.json();
    if (!data.ok) {
      alert(data.message || "Could not delete task.");
      return;
    }
  } catch (e) {
    alert("Request failed - check your connection.");
    return;
  }

  showTab("log");
  loadSessions();
}

function closeTaskDetail() {
  showTab("log"); // discards any unsaved edits - matches the Back control's job
}

// ---------- Confirm dialog (reusable) ----------
// A styled stand-in for the browser's native confirm() - same idea
// (blocks until the user picks an option), but matches the app's own
// theme instead of the browser's plain, inconsistent-across-browsers box.
let confirmResolve = null;

function showConfirmDialog(message, confirmLabel = "Delete") {
  document.getElementById("confirm-message").textContent = message;
  document.getElementById("confirm-ok-btn").textContent = confirmLabel;
  document.getElementById("confirm-overlay").classList.add("visible");
  return new Promise((resolve) => { confirmResolve = resolve; });
}

function resolveConfirm(result) {
  document.getElementById("confirm-overlay").classList.remove("visible");
  if (confirmResolve) {
    confirmResolve(result);
    confirmResolve = null;
  }
}

// ---------- Notes ----------
// State machine for the record button: "idle" -> "recording" ->
// "transcribing" -> back to "idle", or "error" if the upload failed.
// pendingBlob is kept in memory through "transcribing"/"error" so
// Retry can resend the SAME recording instead of making you talk again.
let noteRecorder = null;
let noteChunks = [];
let noteState = "idle";
let pendingBlob = null;
let recordingCancelled = false; // set right before noteRecorder.stop() when Cancel (not Stop) was tapped

function setNoteState(next) {
  noteState = next;
  const recordBtn = document.getElementById("note-record-btn");
  const cancelBtn = document.getElementById("note-cancel-btn");
  const statusEl = document.getElementById("note-status");
  const errorEl = document.getElementById("note-error");

  recordBtn.disabled = next === "transcribing";
  cancelBtn.classList.toggle("visible", next === "recording");
  statusEl.classList.toggle("visible", next === "transcribing");
  errorEl.classList.toggle("visible", next === "error");

  if (next === "recording") {
    recordBtn.textContent = "⏹ Stop & Save";
    recordBtn.classList.add("recording");
  } else {
    recordBtn.textContent = "🎤 Record a note";
    recordBtn.classList.remove("recording");
  }
}

function toggleRecording() {
  if (noteState === "recording") {
    stopRecording();
  } else if (noteState === "idle" || noteState === "error") {
    // Starting fresh from an error discards the failed recording -
    // Retry (in the error banner) is the way to resend it instead.
    startRecording();
  }
}

async function startRecording() {
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    alert("Couldn't access the microphone. Check your browser's permission for this site.");
    return;
  }

  noteChunks = [];
  recordingCancelled = false;
  noteRecorder = new MediaRecorder(stream);
  noteRecorder.ondataavailable = (e) => {
    if (e.data.size > 0) noteChunks.push(e.data);
  };
  noteRecorder.onstop = () => {
    stream.getTracks().forEach((track) => track.stop());
    if (recordingCancelled) {
      // Discard - Cancel was tapped, not Stop. Nothing gets uploaded.
      noteChunks = [];
      setNoteState("idle");
      return;
    }
    pendingBlob = new Blob(noteChunks, { type: noteRecorder.mimeType || "audio/webm" });
    uploadRecording();
  };
  noteRecorder.start();
  setNoteState("recording");
}

function stopRecording() {
  if (noteRecorder && noteState === "recording") {
    noteRecorder.stop(); // onstop (above) kicks off the upload
    setNoteState("transcribing");
  }
}

function cancelRecording() {
  if (noteRecorder && noteState === "recording") {
    recordingCancelled = true;
    noteRecorder.stop(); // onstop (above) sees the flag and discards instead of uploading
  }
}

async function uploadRecording() {
  setNoteState("transcribing");
  try {
    const ext = pendingBlob.type.includes("mp4") ? "mp4" : "webm";
    const formData = new FormData();
    formData.append("audio", pendingBlob, `recording.${ext}`);

    // No Content-Type header here on purpose - the browser sets its own
    // multipart boundary for FormData, and overriding it breaks the upload.
    const res = await authedFetch("/api/notes", {
      method: "POST",
      headers: { "X-API-Key": apiKey },
      body: formData
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.message || "Could not save that note.");

    prependNote(data.note);
    pendingBlob = null;
    setNoteState("idle");
  } catch (e) {
    document.getElementById("note-error-message").textContent =
      e.message && e.message !== "Failed to fetch"
        ? e.message
        : "Couldn't save that note - check your connection.";
    setNoteState("error");
  }
}

function retryUpload() {
  if (!pendingBlob) {
    setNoteState("idle");
    return;
  }
  uploadRecording();
}

function noteCardHtml(note) {
  const audioSrc = note.audio_url ? escapeHtml(note.audio_url) : "";
  return `
    <div class="note-transcript">${escapeHtml(note.transcript)}</div>
    <div class="note-row">
      <audio controls class="note-audio" src="${audioSrc}"></audio>
      <button class="note-del" onclick="deleteNote(${note.id})">✕</button>
    </div>
    <div class="note-meta">${escapeHtml(note.created_at)}</div>`;
}

function prependNote(note) {
  const list = document.getElementById("notes-list");
  const emptyMsg = list.querySelector(".empty-msg");
  if (emptyMsg) emptyMsg.remove();

  const card = document.createElement("div");
  card.className = "card note-card";
  card.dataset.noteId = note.id;
  card.innerHTML = noteCardHtml(note);
  list.prepend(card);
}

async function loadNotes() {
  const list = document.getElementById("notes-list");
  try {
    const res = await authedFetch("/api/notes", { headers: headers() });
    const data = await res.json();
    if (!data.ok) throw new Error(data.message || "Could not load notes.");

    list.innerHTML = "";
    if (!data.notes || data.notes.length === 0) {
      list.innerHTML = '<p class="empty-msg" style="color:var(--muted); text-align:center;">No notes yet.</p>';
      return;
    }
    data.notes.forEach((note) => {
      const card = document.createElement("div");
      card.className = "card note-card";
      card.dataset.noteId = note.id;
      card.innerHTML = noteCardHtml(note);
      list.appendChild(card);
    });
  } catch (e) {
    list.innerHTML = '<p style="color:var(--accent-2); text-align:center;">Couldn\'t load notes - check your connection.</p>';
  }
}

async function deleteNote(id) {
  const confirmed = await showConfirmDialog("Delete this note? This can't be undone.");
  if (!confirmed) return;
  try {
    const res = await authedFetch(`/api/notes/${id}`, { method: "DELETE", headers: headers() });
    const data = await res.json();
    if (!data.ok) {
      alert(data.message || "Could not delete note.");
      return;
    }
  } catch (e) {
    alert("Request failed - check your connection.");
    return;
  }

  const card = document.querySelector(`.note-card[data-note-id="${id}"]`);
  if (card) card.remove();
  const list = document.getElementById("notes-list");
  if (!list.children.length) {
    list.innerHTML = '<p class="empty-msg" style="color:var(--muted); text-align:center;">No notes yet.</p>';
  }
}

function init() {
  refreshStatus();
  loadSessions();
}

// On load: skip login if we already have a stored, still-fresh key -
// otherwise treat it the same as never having logged in.
if (apiKey) {
  if (isSessionExpired()) {
    handleSessionExpired("Your session expired. Please log in again.");
  } else {
    verifyKeyThenInit();
  }
}

// Catches a tab left open in the background past the expiry window -
// without this, expiry would only ever get noticed on the next request
// (authedFetch) or the next full page load, not while just sitting idle.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && apiKey && isSessionExpired()) {
    handleSessionExpired("Your session expired. Please log in again.");
  }
});
</script>
</body>
</html>
