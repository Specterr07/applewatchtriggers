<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sheev</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --border: #2a2e38;
    --text: #e8e9ec;
    --muted: #8b8f9a;
    --accent: #5b8cff;
    --accent-2: #ff6b6b;
    --green: #3ecf8e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 60px;
  }
  header {
    padding: 20px 16px 8px;
    text-align: center;
  }
  header h1 { font-size: 20px; margin: 0; font-weight: 600; }
  header .tagline { color: var(--muted); font-size: 13px; margin: 4px 0 0; }

  /* --- Login overlay --- */
  #login-overlay {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  #login-overlay .box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px 22px;
    width: 100%; max-width: 320px;
    text-align: center;
  }
  #login-overlay input {
    width: 100%;
    padding: 12px;
    margin: 16px 0;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #10131a;
    color: var(--text);
    font-size: 15px;
  }
  #login-overlay button, .primary-btn {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 15px;
    font-weight: 600;
  }
  #login-error { color: var(--accent-2); font-size: 13px; min-height: 16px; }

  /* --- Tabs --- */
  .tabs {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    max-width: 700px;
    margin: 0 auto;
  }
  .tab-btn {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
  }
  .tab-btn.active { color: white; border-color: var(--accent); background: #202436; }

  .view { display: none; max-width: 700px; margin: 0 auto; padding: 0 16px; }
  .view.active { display: block; }

  /* --- Time Log --- */
  #toggle-btn {
    width: 100%;
    padding: 22px;
    border-radius: 16px;
    border: none;
    font-size: 18px;
    font-weight: 700;
    margin: 8px 0 20px;
    background: var(--green);
    color: #063;
  }
  #toggle-btn.ending { background: var(--accent-2); color: #400; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .session-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
  .session-row .muted { color: var(--muted); font-size: 12px; }
  .session-row .dur { font-weight: 700; color: var(--green); }

  /* --- Bento cards (Time Log) --- */
  .bento-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
  }
  .bento-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .bento-card:hover, .bento-card:focus { border-color: var(--accent); outline: none; }
  .bento-title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bento-meta { font-size: 11px; color: var(--muted); margin-bottom: 12px; }
  .bento-duration { font-size: 28px; font-weight: 800; color: var(--green); line-height: 1; }
  .bento-unit { font-size: 13px; font-weight: 600; color: var(--muted); margin-left: 4px; }

  /* --- Task detail --- */
  .back-btn {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 14px;
    font-weight: 600;
    padding: 8px 0;
    margin-bottom: 8px;
  }
  .detail-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
  }
  .detail-title-input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    font-size: 18px;
    font-weight: 700;
    padding: 4px 0 8px;
    margin-bottom: 4px;
  }
  .detail-title-input:focus { outline: none; border-bottom-color: var(--accent); }
  .detail-date { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .detail-duration { font-size: 36px; font-weight: 800; color: var(--green); margin-bottom: 18px; }
  .detail-label {
    display: block;
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin: 12px 0 4px;
  }
  .detail-card input[type="datetime-local"] {
    width: 100%;
    background: #10131a;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px;
    font-size: 13px;
  }
  .detail-actions { display: flex; gap: 8px; margin-top: 20px; }
  .detail-actions button { flex: 1; width: auto; }
  .danger-btn {
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--accent-2);
    background: transparent;
    color: var(--accent-2);
    font-size: 15px;
    font-weight: 600;
  }

  /* --- Planner --- */
  #planner-date {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    margin-bottom: 14px;
    font-size: 14px;
  }
  .add-form {
    display: flex; flex-wrap: wrap; gap: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 16px;
  }
  .add-form input {
    background: #10131a; border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 8px; font-size: 13px;
  }
  .add-form input[type="text"] { flex: 1 1 100%; }
  .add-form input[type="time"] { flex: 1; }
  .add-form button { flex: 1 1 100%; margin-top: 4px; }

  #timeline {
    position: relative;
    border-left: 1px solid var(--border);
    margin-left: 44px;
  }
  .hour-row {
    position: relative;
    height: 48px;
    border-top: 1px solid var(--border);
  }
  .hour-label {
    position: absolute;
    left: -44px; top: -8px;
    width: 38px;
    font-size: 11px;
    color: var(--muted);
    text-align: right;
  }
  .planner-item {
    position: absolute;
    left: 6px; right: 6px;
    background: #26304a;
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 12px;
    overflow: hidden;
  }
  .planner-item.done {
    opacity: 0.45;
    text-decoration: line-through;
    border-left-color: var(--green);
  }
  .planner-item .t { color: var(--muted); font-size: 10px; }
  .planner-item .del {
    float: right; color: var(--accent-2); font-weight: 700;
  }
</style>
</head>
<body>

<div id="login-overlay">
  <div class="box">
    <h2>🔒 Sheev</h2>
    <p style="color:var(--muted); font-size:13px;">Enter your API key to continue</p>
    <input type="password" id="key-input" placeholder="API key" autocapitalize="off" autocorrect="off">
    <div id="login-error"></div>
    <button onclick="submitKey()">Unlock</button>
  </div>
</div>

<header>
  <h1>⏱ Sheev</h1>
  <p class="tagline">Let's get it done!</p>
</header>

<div class="tabs">
  <button class="tab-btn active" id="tab-log-btn" onclick="showTab('log')">Time Log</button>
  <button class="tab-btn" id="tab-planner-btn" onclick="showTab('planner')">Planner</button>
  <a class="tab-btn" href="/canvas" style="text-decoration:none; display:flex; align-items:center; justify-content:center;">Canvas</a>
</div>

<div class="view active" id="view-log">
  <button id="toggle-btn" onclick="doToggle()">...</button>
  <div id="sessions" class="bento-grid"></div>
</div>

<div class="view" id="view-detail">
  <button class="back-btn" onclick="closeTaskDetail()">← Back</button>
  <div class="detail-card">
    <input type="text" id="detail-title" class="detail-title-input" placeholder="Task name">
    <div class="detail-date" id="detail-date"></div>
    <div class="detail-duration" id="detail-duration">—</div>

    <label class="detail-label" for="detail-start">Start</label>
    <input type="datetime-local" id="detail-start" step="1">

    <label class="detail-label" for="detail-end">End</label>
    <input type="datetime-local" id="detail-end" step="1">

    <div class="detail-actions">
      <button class="primary-btn" onclick="saveTaskDetail()">Save</button>
      <button class="danger-btn" onclick="deleteTaskDetail()">Delete</button>
    </div>
  </div>
</div>

<div class="view" id="view-planner">
  <input type="date" id="planner-date" onchange="loadPlanner()">
  <div class="add-form">
    <input type="text" id="p-title" placeholder="What are you scheduling?">
    <input type="time" id="p-start">
    <input type="time" id="p-end">
    <button class="primary-btn" onclick="addPlannerItem()">Add to schedule</button>
  </div>
  <div id="timeline"></div>
</div>

<script>
const API_KEY_STORAGE = "task_logger_api_key";
let apiKey = localStorage.getItem(API_KEY_STORAGE);

function headers() {
  return { "Content-Type": "application/json", "X-API-Key": apiKey };
}

function submitKey() {
  const val = document.getElementById("key-input").value.trim();
  if (!val) return;
  apiKey = val;
  localStorage.setItem(API_KEY_STORAGE, val);
  verifyKeyThenInit();
}

async function verifyKeyThenInit() {
  try {
    const res = await fetch("/status", { headers: headers() });
    if (res.status === 401) {
      document.getElementById("login-error").textContent = "Incorrect key. Try again.";
      localStorage.removeItem(API_KEY_STORAGE);
      apiKey = null;
      return;
    }
    document.getElementById("login-overlay").style.display = "none";
    init();
  } catch (e) {
    document.getElementById("login-error").textContent = "Couldn't reach server. Check your connection.";
  }
}

// Shows one of the three views (log / detail / planner) and hides the
// others. Split out from showTab() because opening a task's detail view
// (from a bento card click) needs to swap views WITHOUT touching which
// tab button looks active - the user is still conceptually "in" Time Log.
function showView(name) {
  document.getElementById("view-log").classList.toggle("active", name === "log");
  document.getElementById("view-detail").classList.toggle("active", name === "detail");
  document.getElementById("view-planner").classList.toggle("active", name === "planner");
}

// Handles the actual tab buttons (Time Log / Planner) - same view-swap,
// plus updating which button is highlighted.
function showTab(name) {
  showView(name);
  document.getElementById("tab-log-btn").classList.toggle("active", name === "log");
  document.getElementById("tab-planner-btn").classList.toggle("active", name === "planner");
  if (name === "planner") loadPlanner();
}

// Escapes a task/session name before it's dropped into innerHTML, so a
// name containing "<", "&", etc. (typed by you, from the webpage's own
// naming field) renders as text instead of broken/injected markup.
function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : String(str);
  return div.innerHTML;
}

// ---------- Time Log ----------
async function refreshStatus() {
  const res = await fetch("/status", { headers: headers() });
  const data = await res.json();
  const btn = document.getElementById("toggle-btn");
  if (data.next_action === "End") {
    btn.textContent = "⏹ End Task";
    btn.classList.add("ending");
  } else {
    btn.textContent = "▶ Start Task";
    btn.classList.remove("ending");
  }
}

async function doToggle() {
  const btn = document.getElementById("toggle-btn");
  btn.disabled = true;
  try {
    await fetch("/toggle", { headers: headers() });
    await refreshStatus();
    await loadSessions();
  } catch (e) {
    alert("Request failed - check your connection.");
  }
  btn.disabled = false;
}

async function loadSessions() {
  const res = await fetch("/api/logs", { headers: headers() });
  const data = await res.json();
  const container = document.getElementById("sessions");
  container.innerHTML = "";
  if (!data.sessions || data.sessions.length === 0) {
    container.innerHTML = '<p style="color:var(--muted); text-align:center;">No sessions logged yet.</p>';
    return;
  }
  // Bento grid: one card per task. name/date/start/end/duration_minutes
  // all come pre-formatted from the backend (including the generic
  // "Task – Fri, 9:00 AM" title for anything logged without a name) -
  // no client-side formatting logic needed here.
  data.sessions.slice(0, 30).forEach(s => {
    const card = document.createElement("button");
    card.className = "bento-card";
    card.type = "button";
    const timeRange = s.end
      ? `${s.start.slice(11, 16)} – ${s.end.slice(11, 16)}`
      : `${s.start.slice(11, 16)} · in progress`;
    const durText = s.duration_minutes != null ? s.duration_minutes : "–";
    card.innerHTML = `
      <div class="bento-title">${escapeHtml(s.name)}</div>
      <div class="bento-meta">${s.date} · ${timeRange}</div>
      <div class="bento-duration">${durText}${s.duration_minutes != null ? '<span class="bento-unit">min</span>' : ""}</div>`;
    card.onclick = () => openTaskDetail(s.id);
    container.appendChild(card);
  });
}

// ---------- Task detail ----------
let currentTask = null; // the task currently shown in the detail view

async function openTaskDetail(id) {
  const res = await fetch(`/api/logs/${id}`, { headers: headers() });
  const data = await res.json();
  if (!data.ok) {
    alert(data.message || "Could not load that task.");
    return;
  }
  currentTask = data.task;
  renderTaskDetail(currentTask);
  showView("detail");
}

function renderTaskDetail(task) {
  document.getElementById("detail-title").value = task.name;
  document.getElementById("detail-date").textContent = task.date;
  document.getElementById("detail-duration").textContent =
    task.duration_minutes != null ? `${task.duration_minutes} min` : "In progress";
  document.getElementById("detail-start").value = toDatetimeLocal(task.start);
  document.getElementById("detail-end").value = task.end ? toDatetimeLocal(task.end) : "";
}

// The backend stores "YYYY-MM-DD HH:MM:SS"; <input type="datetime-local">
// wants "YYYY-MM-DDTHH:MM:SS" (a "T" instead of the space - the "step=1"
// on those inputs is what makes them collect/show seconds at all).
function toDatetimeLocal(backendTimestamp) {
  return backendTimestamp.replace(" ", "T");
}

// Reverse of toDatetimeLocal. Defensive about the seconds: if a browser's
// datetime-local picker ignores step="1" and only gives minutes, this
// pads ":00" back on rather than sending the backend a timestamp it will
// reject as badly formatted.
function toBackendTimestamp(datetimeLocalValue) {
  const withSpace = datetimeLocalValue.replace("T", " ");
  return withSpace.length === 16 ? `${withSpace}:00` : withSpace;
}

async function saveTaskDetail() {
  const newName = document.getElementById("detail-title").value.trim();
  const newStartLocal = document.getElementById("detail-start").value;
  const newEndLocal = document.getElementById("detail-end").value;

  // Only send fields that actually changed, per the API contract - not
  // "start"/"end" just because the picker round-tripped the same value.
  const patch = {};
  if (newName !== currentTask.name) patch.name = newName;

  if (newStartLocal) {
    const newStart = toBackendTimestamp(newStartLocal);
    if (newStart !== currentTask.start) patch.start = newStart;
  }
  // Unlike start, end is allowed to be cleared - that reopens the task
  // (duration goes back to "in progress" on the backend).
  const newEnd = newEndLocal ? toBackendTimestamp(newEndLocal) : null;
  if (newEnd !== currentTask.end) patch.end = newEnd;

  if (Object.keys(patch).length === 0) {
    showTab("log"); // nothing changed - just go back
    return;
  }

  try {
    const res = await fetch(`/api/logs/${currentTask.id}`, {
      method: "PATCH",
      headers: headers(),
      body: JSON.stringify(patch)
    });
    const data = await res.json();
    if (!data.ok) {
      alert(data.message || "Could not save changes.");
      return;
    }
  } catch (e) {
    alert("Request failed - check your connection.");
    return;
  }

  showTab("log");
  loadSessions();
}

async function deleteTaskDetail() {
  if (!confirm("Delete this task? This can't be undone.")) return;
  try {
    const res = await fetch(`/api/logs/${currentTask.id}`, { method: "DELETE", headers: headers() });
    const data = await res.json();
    if (!data.ok) {
      alert(data.message || "Could not delete task.");
      return;
    }
  } catch (e) {
    alert("Request failed - check your connection.");
    return;
  }

  showTab("log");
  loadSessions();
}

function closeTaskDetail() {
  showTab("log"); // discards any unsaved edits - matches the Back control's job
}

// ---------- Planner ----------
function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function loadPlanner() {
  const dateInput = document.getElementById("planner-date");
  if (!dateInput.value) dateInput.value = todayStr();
  buildTimelineSkeleton();
  fetchPlannerItems(dateInput.value);
}

function buildTimelineSkeleton() {
  const timeline = document.getElementById("timeline");
  timeline.innerHTML = "";
  for (let h = 6; h <= 23; h++) {
    const row = document.createElement("div");
    row.className = "hour-row";
    row.innerHTML = `<div class="hour-label">${String(h).padStart(2,"0")}:00</div>`;
    timeline.appendChild(row);
  }
}

function timeToMinutesFrom6am(t) {
  const [h, m] = t.split(":").map(Number);
  return (h - 6) * 60 + m;
}

async function fetchPlannerItems(date) {
  const res = await fetch(`/api/planner?date=${date}`, { headers: headers() });
  const data = await res.json();
  const timeline = document.getElementById("timeline");
  // Remove any previously rendered items (keep hour rows)
  timeline.querySelectorAll(".planner-item").forEach(el => el.remove());

  (data.items || []).forEach(item => {
    const startMin = timeToMinutesFrom6am(item.start_time);
    const endMin = timeToMinutesFrom6am(item.end_time);
    const top = (startMin / 60) * 48;
    const height = Math.max(((endMin - startMin) / 60) * 48, 20);

    const div = document.createElement("div");
    div.className = "planner-item" + (item.completed === "True" ? " done" : "");
    div.style.top = top + "px";
    div.style.height = height + "px";
    div.innerHTML = `
      <span class="del" onclick="deletePlannerItem('${item.id}')">✕</span>
      <div class="t">${item.start_time}–${item.end_time}</div>
      <div>${item.title}</div>`;
    div.onclick = (e) => {
      if (e.target.classList.contains("del")) return;
      togglePlannerItem(item.id, item.completed !== "True");
    };
    timeline.appendChild(div);
  });
}

async function addPlannerItem() {
  const title = document.getElementById("p-title").value.trim();
  const start = document.getElementById("p-start").value;
  const end = document.getElementById("p-end").value;
  const date = document.getElementById("planner-date").value;
  if (!title || !start || !end) { alert("Fill in title, start and end time."); return; }
  if (end <= start) { alert("End time must be after start time."); return; }

  await fetch("/api/planner", {
    method: "POST",
    headers: headers(),
    body: JSON.stringify({ date, start_time: start, end_time: end, title })
  });
  document.getElementById("p-title").value = "";
  fetchPlannerItems(date);
}

async function togglePlannerItem(id, completed) {
  await fetch(`/api/planner/${id}`, {
    method: "PATCH",
    headers: headers(),
    body: JSON.stringify({ completed: String(completed) })
  });
  fetchPlannerItems(document.getElementById("planner-date").value);
}

async function deletePlannerItem(id) {
  await fetch(`/api/planner/${id}`, { method: "DELETE", headers: headers() });
  fetchPlannerItems(document.getElementById("planner-date").value);
}

function init() {
  refreshStatus();
  loadSessions();
}

// On load: skip login if we already have a stored key
if (apiKey) {
  verifyKeyThenInit();
}
</script>
</body>
</html>
