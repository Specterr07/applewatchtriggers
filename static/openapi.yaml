openapi: 3.0.3
info:
  title: Sheev API
  version: "1.0.0"
  description: >
    API for logging Start/End task events (used by an Apple Watch Shortcut
    and a web frontend). All endpoints require an API key, supplied either
    as a query param (?key=...) or a header (X-API-Key).

servers:
  - url: https://applewatchtriggers.fly.dev
    description: Production (Fly.io)
  - url: http://localhost:8080
    description: Local development

security:
  - ApiKeyHeader: []
  - ApiKeyQuery: []

paths:
  /toggle:
    get:
      summary: Log a Start or End event
      description: >
        Toggles based on current state: if no task is in progress, this
        starts one. If a task is already in progress, this ends it and
        calculates the duration. Backed by tasks.db (SQLite) - each Start
        creates one task row with a stable id; the matching End fills in
        that same row's end/duration_minutes.
      tags: [Time Log]
      parameters:
        - name: name
          in: query
          required: false
          description: >
            Optional task name. Only ever sent by the webpage's own
            Start/End button - the Apple Watch Shortcut never sends this,
            so every Watch-logged task gets a generic
            "Task – <weekday>, <time>" title instead. Query param (not a
            JSON body) so /toggle can stay a plain GET the Shortcut can call.
          schema: { type: string, example: "Deep work" }
      responses:
        "200":
          description: Event logged successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  action: { type: string, enum: [Start, End] }
                  id: { type: integer, example: 42, description: "The task's id in tasks.db" }
                  message: { type: string, example: "Task started at 09:00" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /status:
    get:
      summary: Check what the next /toggle call will do
      description: Read-only - does not log anything.
      tags: [Time Log]
      responses:
        "200":
          description: Next action
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  next_action: { type: string, enum: [Start, End] }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/logs:
    get:
      summary: Get every logged task
      description: >
        Returns every task, newest first - everything a bento-card grid
        needs to render. A currently in-progress task has "end" and
        "duration_minutes" as null. Kept under the "sessions" key for
        backward compatibility with the webpage's existing Time Log view.
      tags: [Time Log]
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/Task" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/logs/{task_id}:
    get:
      summary: Get full detail for one task
      description: What the task detail page loads.
      tags: [Time Log]
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Task detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  task: { $ref: "#/components/schemas/Task" }
        "404":
          description: No task with that id
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      summary: Edit a task's name/start/end
      description: >
        Send any subset of name/start/end to update. If start or end
        changes, duration_minutes is recalculated server-side so it can
        never go stale.
      tags: [Time Log]
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: "Deep work" }
                start: { type: string, example: "2026-09-14 09:00:00", description: "YYYY-MM-DD HH:MM:SS" }
                end: { type: string, example: "2026-09-14 09:45:00", description: "YYYY-MM-DD HH:MM:SS" }
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  task: { $ref: "#/components/schemas/Task" }
        "400":
          description: Nothing to update, or start/end isn't in YYYY-MM-DD HH:MM:SS format
        "404":
          description: No task with that id
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      summary: Delete a task
      description: Permanent - ids are never reused, so an old bento-card link never ends up pointing at a different task.
      tags: [Time Log]
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted successfully
        "404":
          description: No task with that id
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/canvas:
    get:
      summary: Get the saved canvas snapshot
      description: >
        Returns whatever the tldraw canvas app (/canvas) last saved.
        snapshot is null if nothing has been saved yet.
      tags: [Canvas]
      responses:
        "200":
          description: Saved canvas snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  snapshot:
                    type: object
                    nullable: true
                    description: Opaque JSON produced by tldraw's getSnapshot() - not a fixed shape.
                  updated_at: { type: string, nullable: true, example: "2026-09-17 15:06:32" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      summary: Save the canvas snapshot
      description: >
        Called by the canvas app a few seconds after the last edit
        (debounced client-side). Overwrites whatever was saved before -
        there's only ever one canvas.
      tags: [Canvas]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [snapshot]
              properties:
                snapshot:
                  type: object
                  description: Opaque JSON produced by tldraw's getSnapshot().
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  updated_at: { type: string, example: "2026-09-17 15:06:32" }
        "400":
          description: Missing snapshot
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/notes:
    get:
      summary: Get every voice note
      description: Newest first. Each note's audio_url is a fresh, temporary Tigris playback link.
      tags: [Notes]
      responses:
        "200":
          description: List of notes
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  notes:
                    type: array
                    items: { $ref: "#/components/schemas/Note" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Upload and save a voice note
      description: >
        Transcribes the recording (Groq), re-encodes it to a small
        mono file (ffmpeg), and stores the compressed audio in Tigris -
        the original high-quality upload is never kept. All of this
        happens in one request, so it can take a few seconds.
      tags: [Notes]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  format: binary
                  description: The recorded audio (whatever format the browser's MediaRecorder produced).
      responses:
        "201":
          description: Note saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  note: { $ref: "#/components/schemas/Note" }
        "400":
          description: No audio file uploaded, or it was empty
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Transcription, compression, or storage failed (see message)

  /api/notes/{note_id}:
    delete:
      summary: Delete a note
      description: Removes both its notes.db row and its audio object in Tigris.
      tags: [Notes]
      parameters:
        - name: note_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted successfully
        "404":
          description: No note with that id
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    ApiKeyQuery:
      type: apiKey
      in: query
      name: key

  schemas:
    Task:
      type: object
      properties:
        id: { type: integer, example: 42 }
        name:
          type: string
          example: "Deep work"
          description: >
            The name set from the webpage, or - if it was logged from the
            Watch, or from the webpage without a name - a generic
            "Task – <weekday>, <time>" title, e.g. "Task – Fri, 9:00 AM".
        date: { type: string, format: date, example: "2026-09-14" }
        start: { type: string, example: "2026-09-14 09:00:00" }
        end: { type: string, example: "2026-09-14 09:45:00", nullable: true }
        duration_minutes: { type: number, nullable: true, example: 45.0 }

    Note:
      type: object
      properties:
        id: { type: integer, example: 7 }
        transcript: { type: string, example: "Remember to call the vet about the appointment." }
        audio_url:
          type: string
          nullable: true
          description: A temporary (1 hour) Tigris playback link, regenerated on every request - not a permanent URL.
        created_at: { type: string, example: "2026-09-17 15:32:00" }

  responses:
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: boolean, example: false }
              message: { type: string, example: "Invalid or missing API key" }
    ServerError:
      description: Server-side error (e.g. file read/write failure)
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: boolean, example: false }
              message: { type: string }